<svg xmlns="http://www.w3.org/2000/svg" width="560" height="820" viewBox="0 0 560 820" role="img" aria-labelledby="integration-flow.zh-CN-title integration-flow.zh-CN-desc" lang="zh-CN">
<title id="integration-flow.zh-CN-title">RoboAPI 集成流程</title><desc id="integration-flow.zh-CN-desc">本仓库适配器将仿真观测发送给外部 RoboAPI 策略服务，并在下次请求中附执行回执；接收动作块后完成映射并控制 RoboLab 仿真。</desc>
