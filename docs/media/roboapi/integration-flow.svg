<svg xmlns="http://www.w3.org/2000/svg" width="560" height="820" viewBox="0 0 560 820" role="img" aria-labelledby="integration-flow-title integration-flow-desc" lang="en">
<title id="integration-flow-title">RoboAPI integration flow</title><desc id="integration-flow-desc">The local repository adapter sends observations and execution receipts to the external RoboAPI policy service, receives action chunks, and controls the RoboLab simulation.</desc>
