name: RoboAPI offline checks
on: [push, pull_request]
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-roboapi-tests.txt
      - run: pip install -r requirements-roboapi-tests.txt
      - run: scripts/test_roboapi.sh -q
